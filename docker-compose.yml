services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: autos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d autos"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx drizzle-kit migrate && npx tsx scripts/seed.ts"
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/autos
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/autos
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: .
    command: npx tsx scripts/worker.ts
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/autos
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
